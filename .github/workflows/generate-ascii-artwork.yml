name: Generate ASCII Artwork

on: push

jobs:
  build_job1:
    runs-on: ubuntu-latest
    steps:
    - name: Install Cowsay Program
      run: sudo apt-get install -y cowsay

    - name: Execute Cowsay CMD
      run: cowsay -f dragon "Run for cover, I am dragon.....RAWR" > dragon.txt

    - name: uplaod dragon file
      uses: actions/upload-artifacts@v4
      with:
        name: dragon-text-file
        path: dragon.txt
          
    

  Test_job_2:
    needs: build_job1
    runs-on: ubuntu-latest
    steps:
    - name: download dragon file
      uses: actions/download-artifacts@v4
      with:
        name: dragon
    
    - name: Sleep for 10 seconds
      run: sleep 10

    - name: Test file Exits
      run: grep -i "dragon" dragon.txt

  deploy_job_3: 
    needs: Test_job_2
    runs-on: ubuntu-latest
    steps:
    - name: download dragon file
      uses: actions/download-artifacts@v4
      with:
        name: dragon

    - name: Read dragon file
      run: cat dragon.txt

    - name: deploy
      run: echo "deploying..."